name: forge-dev

# Local development infrastructure only — never used for staging/production,
# which use managed services per docs/system-architecture.md §14. Redis is
# provisioned here for future milestones (Phase 2 data-platform kernel /
# Phase 10 notifications) and is intentionally not wired into the API yet.

services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - '5432:5432'
    volumes:
      - forge_postgres_data:/var/lib/postgresql/data
    networks:
      - forge-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forge -d forge']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - forge_redis_data:/data
    networks:
      - forge-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forge_postgres_data:
  forge_redis_data:

networks:
  forge-dev:
    driver: bridge
